name: QA validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://iass.dr-iyas.com
      API_BASE_URL: https://api-iass.dr-iyas.com/api
      NEXT_PUBLIC_API_BASE_URL: https://api-iass.dr-iyas.com/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Start production app
        run: |
          npm run start -- -p 3000 > /tmp/iass-next.log 2>&1 &
          echo $! > /tmp/iass-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/iass-next.log
          exit 1

      - name: Validate baseline security headers
        run: |
          headers="$(curl -fsSI http://127.0.0.1:3000/)"
          echo "$headers"
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          echo "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
          echo "$headers" | grep -qi '^permissions-policy:'
          echo "$headers" | grep -qi '^strict-transport-security:'

      - name: Audit local production build
        env:
          TARGET_URL: http://127.0.0.1:3000
          PUBLIC_URL: https://iass.dr-iyas.com
        run: node scripts/local-build-audit.mjs

      - name: Show server log
        if: always()
        run: cat /tmp/iass-next.log || true

  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS and TLS diagnostics
        run: |
          set +e
          echo '=== website getent ==='
          getent ahosts iass.dr-iyas.com
          echo '=== website dig A ==='
          dig +short A iass.dr-iyas.com
          echo '=== website dig AAAA ==='
          dig +short AAAA iass.dr-iyas.com
          echo '=== API dig A ==='
          dig +short A api-iass.dr-iyas.com
          echo '=== parent NS ==='
          dig +short NS dr-iyas.com
          echo '=== website HTTPS ==='
          curl -vkI --connect-timeout 10 --max-time 20 https://iass.dr-iyas.com/
          echo '=== API health ==='
          curl -vkI --connect-timeout 10 --max-time 20 https://api-iass.dr-iyas.com/api/health
          exit 0
