name: Security dependency upgrade

on:
  push:
    branches:
      - 004-production-validation-fixes

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, 'chore: upgrade Next.js security patch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 004-production-validation-fixes
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install secure Next.js patch
        run: npm install next@16.3.5 eslint-config-next@16.3.5 --save-exact

      - name: Apply safe transitive audit fixes
        run: npm audit fix || true

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit dependency lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: upgrade Next.js security patch"
          git push origin HEAD:004-production-validation-fixes
